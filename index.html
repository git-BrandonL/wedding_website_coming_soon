<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brandon & Vickie's Wedding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:         #FFFFFF;
      --beige:         #F0EDE8;
      --beige-dark:    #E2DDD6;
      --charcoal:      #1C1C1A;
      --stone:         #7A756E;
      --stone-light:   #B0AAA2;
      --serif-display: 'Oranienbaum', serif;
      --serif-body:    'Raleway', serif;
    }

    html, body {
      height: 100%;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--serif-body);
      font-weight: 300;
      color: var(--charcoal);
      background: var(--white);
      font-size: 18px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 3rem;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(6px);
      border-bottom: 0.5px solid var(--beige-dark);
    }

    .nav-logo {
      font-family: var(--serif-display);
      font-size: 0.95rem;
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.01em;
      color: var(--charcoal);
      text-decoration: none;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8rem 2rem 4rem;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Decorative corner lines */
    main::before,
    main::after {
      content: '';
      position: absolute;
      width: 120px;
      height: 120px;
      border-color: var(--beige-dark);
      border-style: solid;
      opacity: 0.6;
    }

    main::before {
      top: 6rem;
      left: 3rem;
      border-width: 0.5px 0 0 0.5px;
    }

    main::after {
      bottom: 3rem;
      right: 3rem;
      border-width: 0 0.5px 0.5px 0;
    }

    /* ── Pre-label ── */
    .pre-label {
      font-family: var(--serif-body);
      font-size: 0.65rem;
      font-weight: 100;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--stone-light);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.2s;
    }

    /* ── Names ── */
    .hero-names {
      font-family: var(--serif-display);
      font-size: clamp(3rem, 8vw, 7.5rem);
      font-weight: 400;
      text-transform: uppercase;
      line-height: 0.95;
      color: var(--charcoal);
      letter-spacing: 0.04em;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.4s;
    }

    /* ── Divider ── */
    .divider {
      width: 40px;
      height: 0.5px;
      background: var(--stone-light);
      margin: 0 auto 2rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.6s;
    }

    /* ── Date ── */
    .hero-date {
      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 100;
      letter-spacing: 0.3em;
      color: var(--stone);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .hero-location {
      font-family: var(--sans);
      font-size: 0.65rem;
      font-weight: 100;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--stone-light);
    }

    /* ── Message card ── */
    .message-card {
      border: 0.5px solid var(--beige-dark);
      padding: 2.5rem 3rem;
      max-width: 520px;
      width: 100%;
      background: var(--beige);
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1s;
    }

    .message-card p {
      font-family: var(--serif-display);
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      font-style: italic;
      color: var(--charcoal);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .message-card .sub-note {
      font-family: var(--serif-body);
      font-size: 0.65rem;
      font-weight: 100;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--stone-light);
      margin-bottom: 0;
    }

    /* ── Pulse dots ── */
    .pulse-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 1.5rem;
    }

    .pulse-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--stone-light);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .pulse-dot:nth-child(2) { animation-delay: 0.3s; }
    .pulse-dot:nth-child(3) { animation-delay: 0.6s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem 2rem;
      border-top: 0.5px solid var(--beige-dark);
      font-family: var(--serif-body);
      font-size: 0.6rem;
      font-weight: 100;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--stone-light);
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      nav { padding: 1rem 1.5rem; }
      main { padding: 6rem 1.5rem 3rem; }

      main::before {
        top: 5rem;
        left: 1.2rem;
        width: 60px;
        height: 60px;
      }
      main::after {
        bottom: 2rem;
        right: 1.2rem;
        width: 60px;
        height: 60px;
      }

      .message-card {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="#">brandon &amp; vickie</a>
  </nav>

  <main>

    <h1 class="hero-names">Brandon and Vickie <br>are getting<br> married</h1>

    <div class="divider"></div>

    <p class="hero-date">23 · August · 2026</p>
    <p class="hero-location">Doltone House Darling Island · Sydney</p>

    <div class="message-card">
      <p>Our wedding website is still being put together, please check back soon.</p>
      <div class="pulse-row">
        <span class="pulse-dot"></span>
        <span class="pulse-dot"></span>
        <span class="pulse-dot"></span>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 &nbsp;&middot;&nbsp; Brandon &amp; Vickie
  </footer>

</body>
</html>
